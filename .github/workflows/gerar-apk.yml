name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extrair projeto original
        run: unzip -q Estudo-PmPB-Android-Studio.zip
      - name: Compilar APK
        working-directory: Estudo-PmPB-Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Nomear APK
        run: cp Estudo-PmPB-Android/app/build/outputs/apk/debug/app-debug.apk Estudo-PmPB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Estudo-PmPB-APK
          path: Estudo-PmPB.apk
          if-no-files-found: error
